[package]
name = "sage-meta"
version = "0.1.0"
edition.workspace = true

[dependencies]
annotate-snippets = "=0.12.16"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
salsa = { version = "=0.26.1", optional = true, default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
syn = { version = "=2.0.117", features = ["full", "visit"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "signal"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
uuid = { version = "=1.28.0", features = ["v4"] }

[features]
salsa = ["dep:salsa"]
