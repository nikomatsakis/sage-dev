[package]
name = "sage-test-harness"
version = "0.1.0"
edition.workspace = true

[dependencies]
expect-test = "1.5.1"
rustc-hash = "2.1.2"
sage-host = { version = "0.1.0", path = "../sage-host" }
sage-ir = { version = "0.1.0", path = "../sage-ir" }
sage-stash = { version = "0.1.0", path = "../sage-stash" }
salsa = "0.26.1"
serde_json = "1.0.149"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
indoc = "2"
sage-meta = { path = "../sage-meta", features = ["salsa"] }
