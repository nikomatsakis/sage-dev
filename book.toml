[book]
title = "Symposiun AGentic Environment (SAGE)"
authors = ["Niko Matsakis"]
language = "en"
src = "md"

[preprocessor.spec]
command = "cargo run --quiet -p sage-meta -- preprocess"
before = ["anchor"]

[preprocessor.anchor]
command = "mdbook-ezanchor"
scan-dirs = ["src", "crates", "vendor"]
optional = true

[preprocessor.mermaid]
command = "mdbook-mermaid"
optional = true

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["spec-anchors.css"]

[output.html.fold]
enable = true
level = 0

[output.linkcheck2]
optional = true
