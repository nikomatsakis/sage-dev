[book]
title = "Symposiun AGentic Environment (SAGE)"
authors = ["Niko Matsakis"]
language = "en"
src = "md"

[preprocessor.anchor]
command = "mdbook-ezanchor"
scan-dirs = ["src"]

[preprocessor.mermaid]
command = "mdbook-mermaid"
optional = true

[output.html]
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 0

[output.linkcheck2]
optional = true
