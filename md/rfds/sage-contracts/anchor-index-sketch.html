<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGE · Anchor index sketch</title>
<style>body { margin: 0; } #sage-anchor-sketch { min-height: 100vh; }</style>
</head>
<body>
<!-- Review prototype: rule text is a snapshot; statuses are illustrative.
     Self-contained export of the conversation sketch, with no external assets. -->
<div id="sage-anchor-sketch">
  <style>
    #sage-anchor-sketch {
      color-scheme: light dark;
      --sage-bg: light-dark(#ffffff, #181c23);

      --sage-text: light-dark(#243042, #e1e8f0);
      --sage-muted: light-dark(#58697b, #acbac9);
      --sage-line: light-dark(#dce3eb, #3b4756);
      --sage-link: light-dark(#2357a4, #9ac3ff);
      --sage-selected: light-dark(#e8f0fc, #2b3b52);
      --sage-done-bg: light-dark(#e8f3ed, #183a30);
      --sage-done-text: light-dark(#245c3c, #9ce0b4);

      --sage-todo-text: light-dark(#79520d, #f5d58b);

      font: 14px/1.55 system-ui, sans-serif;
    }
    #sage-anchor-sketch * { box-sizing: border-box; }
    #sage-anchor-sketch [hidden] { display: none !important; }
    #sage-anchor-sketch button, #sage-anchor-sketch input { font: inherit; }
    #sage-anchor-sketch button, #sage-anchor-sketch a { -webkit-tap-highlight-color: transparent; }
    #sage-anchor-sketch a { color: var(--sage-link); text-decoration: none; }
    #sage-anchor-sketch a:hover { text-decoration: underline; }
    #sage-anchor-sketch button { color: var(--sage-text); background: var(--sage-bg); border: 1px solid var(--sage-line); border-radius: 5px; padding: 6px 10px; }
    #sage-anchor-sketch button:hover { background: var(--sage-selected); }
    #sage-anchor-sketch :focus-visible { outline: 2px solid var(--sage-link); outline-offset: 3px; }

    #sage-anchor-sketch header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 18px 25px; border-bottom: 1px solid var(--sage-line); padding-right: 100px; }
    #sage-anchor-sketch .sage-wordmark { font-weight: 650; letter-spacing: .12em; }
    #sage-anchor-sketch .sage-muted { color: var(--sage-muted); }
    #sage-anchor-sketch .sage-shell { display: grid; grid-template-columns: 175px minmax(0, 1fr); min-height: 640px; }
    #sage-anchor-sketch aside { padding: 23px 14px; background: var(--sage-panel); border-right: 1px solid var(--sage-line); }

  <script>
    (() => {
      const root = document.getElementById('sage-anchor-sketch');
      const rows = root.querySelector('#sage-rows');
      const search = root.querySelector('#sage-search');
      const rules = JSON.parse(root.querySelector('#sage-sketch-data').textContent);
      const byName = new Map(rules.map(rule => [rule.name, rule]));
      const groups = ['meta', 'meta.book', 'meta.spec'];
      const state = { query: '', closed: ['meta.spec'], expanded: ['meta.book.self_description'], route: 'index' };
      const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const prose = value => escape(value).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      const statuses = ['Implemented', 'TODO', 'N/A'];
      const badge = status => `<span class="sage-badge" data-status="${status}">${status}</span>`;
      const badges = values => values.map(badge).join('');
      const routeLink = (route, label) => `<a href="#${escape(route)}" data-route="${escape(route)}">${label}</a>`;
      const matchingRules = () => rules.filter(rule => `${rule.name} ${rule.text}`.toLowerCase().includes(state.query.toLowerCase()));
      const inGroup = (rule, group) => rule.name.startsWith(group + '.');
      function countMarkup(entries, side) {
        return statuses.map(status => {
          const count = entries.filter(rule => rule[side].includes(status)).length;
          return count ? `<span class="sage-count">${count} ${status}</span>` : '';
        }).join('');
      }
      function renderRows() {
        const matches = matchingRules();
        const queryActive = state.query.length > 0;
        const closed = group => !queryActive && state.closed.includes(group);
        let html = '';
        for (const group of groups) {
          const entries = matches.filter(rule => inGroup(rule, group));
          if (!entries.length || (group !== 'meta' && closed('meta'))) continue;
          const depth = group.split('.').length - 1;
          html += `<tr class="sage-group"><td class="sage-indent" style="--sage-depth:${depth}"><button type="button" data-group="${group}" aria-expanded="${!closed(group)}" aria-label="${closed(group)?'Expand':'Collapse'} ${group}" ${queryActive?'disabled':''}><span class="sage-arrow" aria-hidden="true">${closed(group)?'▸':'▾'}</span> <code>${group}</code> <span class="sage-count">${entries.length} rules</span></button></td><td>${countMarkup(entries,'impl')}</td><td>${countMarkup(entries,'tests')}</td></tr>`;
          if (group === 'meta' || closed(group)) continue;
          for (const rule of entries) {
            const open = state.expanded.includes(rule.name);
            const textId = 'sage-text-' + rule.name.replaceAll('.', '-');
            html += `<tr><td class="sage-indent" style="--sage-depth:2"><div class="sage-label"><button type="button" class="sage-rule-toggle" data-rule="${rule.name}" aria-expanded="${open}" aria-controls="${textId}" aria-label="${open?'Hide':'Show'} text for ${rule.name}"><span aria-hidden="true">${open?'▾':'▸'}</span></button>${routeLink('anchor/'+rule.name, '<code>'+escape(rule.name)+'</code>')}</div></td><td>${badges(rule.impl)}</td><td>${badges(rule.tests)}</td></tr>`;
            html += `<tr class="sage-rule-text" id="${textId}" ${open?'':'hidden'}><td colspan="3"><p>${prose(rule.text)}</p>${routeLink('chapter/'+rule.group+'/'+rule.name, 'Definition context')} · ${routeLink('anchor/'+rule.name,'Implementation &amp; tests →')}</td></tr>`;
          }
        }
        rows.innerHTML = html || '<tr><td colspan="3" class="sage-empty">No matching rules.</td></tr>';
        root.querySelector('#sage-result-count').textContent = `${matches.length} of ${rules.length} sample rules · group counts count rules per status; mixed rules appear in both`;
        root.querySelector('#sage-expand').disabled = queryActive;
        root.querySelector('#sage-collapse').disabled = queryActive;
      }
      function connectionMarkup(rule, side) {
        return rule[side].map(status => {
          const explanation = status === 'TODO' ? 'Pending work. A placeholder retains this status even if its empty test passes.' : status === 'N/A' ? 'Example not_applicable entry. Its rationale stays visible for review.' : 'Example ordinary entry. This badge records an association, not a successful test run.';
          return `<div class="sage-connection">${badge(status)}<p>${explanation}</p>${status === 'TODO' && rule.stub ? `<details><summary>View existing TODO test source</summary><div class="sage-caption">crates/sage-meta/tests/spec_plan.rs · mod todo</div><pre><code>${escape(rule.stub)}</code></pre></details>` : '<span class="sage-caption">Illustrative association; no implementation excerpt or run is asserted by this sketch.</span>'}</div>`;
        }).join('');
      }
      function renderRoute() {
        const [view, key, selected] = state.route.split('/');
        root.querySelector('#sage-index-view').hidden = view !== 'index';
        root.querySelector('#sage-detail-view').hidden = view !== 'anchor';
        root.querySelector('#sage-chapter-view').hidden = view !== 'chapter';
        root.querySelectorAll('aside a').forEach(link => {
          if (link.dataset.route === (view === 'anchor' ? 'index' : view === 'chapter' ? `chapter/${key}` : 'index')) link.setAttribute('aria-current','page');
          else link.removeAttribute('aria-current');
        });
        if (view === 'anchor') {
          const rule = byName.get(key);
          root.querySelector('#sage-detail-view').innerHTML = `${routeLink('index','← Anchor index')}<h1>${escape(rule.name)}</h1><div>${badges(rule.impl)} <span class="sage-caption">implementation</span> &nbsp; ${badges(rule.tests)} <span class="sage-caption">tests</span></div><div class="sage-definition">${prose(rule.text)}</div>${routeLink('chapter/'+rule.group+'/'+rule.name,'View in chapter →')}<div class="sage-caption">${escape(rule.file)}</div><div class="sage-connections"><section><h2>Implementation</h2>${connectionMarkup(rule,'impl')}</section><section><h2>Tests / evidence</h2>${connectionMarkup(rule,'tests')}<p class="sage-caption">No recorded runs in this sketch.</p></section></div>`;
        } else if (view === 'chapter') {
          const chapterRules = rules.filter(rule => rule.group === key);
          root.querySelector('#sage-chapter-view').innerHTML = `${routeLink('index','← Anchor index')}<div class="sage-eyebrow">Design / Chapter excerpt</div><h1>${key==='meta.book'?'Specification Book':'Anchor mechanics'}</h1><p class="sage-caption">Selected paragraphs from ${escape(chapterRules[0].file)}</p>${chapterRules.map(rule => `<section class="sage-context-rule" data-selected="${rule.name===selected}">${routeLink('anchor/'+rule.name,'<code>'+escape(rule.name)+'</code>')}<p>${prose(rule.text)}</p></section>`).join('')}`;
        } else renderRows();
      }
      function validRoute(route) {
        const [view, key] = route.split('/');
        return route === 'index' || (view === 'anchor' && byName.has(key)) || (view === 'chapter' && ['meta.book','meta.spec'].includes(key));
      }
      function navigate(route) {
        const previous = state.route;
        state.route = validRoute(route) ? route : 'index';
        renderRoute();
        let target;
        if (state.route.startsWith('chapter/')) {
          target = root.querySelector('#sage-chapter-view [data-selected="true"] a') || root.querySelector('#sage-chapter-view a');
        } else if (state.route.startsWith('anchor/')) {
          target = root.querySelector('#sage-detail-view a');
        } else {
          const oldName = previous.startsWith('anchor/') ? previous.split('/')[1] : previous.split('/')[2];
          target = [...rows.querySelectorAll('[data-route]')].find(link => link.dataset.route === 'anchor/' + oldName) || search;
        }
        target?.focus({preventScroll:true});
        target?.scrollIntoView({block:'nearest'});
      }
      function save() {
        window.openai?.setWidgetState?.({modelContent:{selectedAnchor:state.route.startsWith('anchor/')?state.route.slice(7):null},privateContent:{...state}})?.catch(() => {});
      }
      function restore(saved) {
        const data = saved?.privateContent;
        if (!data) return;
        if (typeof data.query === 'string') state.query = data.query;
        if (Array.isArray(data.closed)) state.closed = data.closed.filter(value => groups.includes(value));
        if (Array.isArray(data.expanded)) state.expanded = data.expanded.filter(value => byName.has(value));
        if (typeof data.route === 'string' && validRoute(data.route)) state.route = data.route;
        search.value = state.query;
      }
      root.addEventListener('click', event => {
        const link = event.target.closest('[data-route]');
        if (link) {
          event.preventDefault();
          navigate(link.dataset.route);
          if (location.hash !== '#' + state.route) location.hash = state.route;
          save(); return;
        }
        const group = event.target.closest('[data-group]');
        if (group && !group.disabled) {
          state.closed = state.closed.includes(group.dataset.group) ? state.closed.filter(value=>value!==group.dataset.group) : [...state.closed, group.dataset.group];
          renderRows();
          root.querySelector(`[data-group="${group.dataset.group}"]`)?.focus();
          save();
        }
        const rule = event.target.closest('[data-rule]');
        if (rule) {
          state.expanded = state.expanded.includes(rule.dataset.rule) ? state.expanded.filter(value=>value!==rule.dataset.rule) : [...state.expanded, rule.dataset.rule];
          renderRows();
          root.querySelector(`[data-rule="${rule.dataset.rule}"]`)?.focus();
          save();
        }
      });
      search.addEventListener('input', () => {state.query = search.value; renderRows(); save();});
      root.querySelector('#sage-expand').addEventListener('click', () => {state.closed=[]; renderRows(); save();});
      root.querySelector('#sage-collapse').addEventListener('click', () => {state.closed=[...groups]; renderRows(); save();});
      window.addEventListener('hashchange', () => {const route=location.hash.slice(1); if(route!==state.route) {navigate(route); save();}});
      window.addEventListener('openai:set_globals', event => {restore(event.detail?.globals?.widgetState); renderRoute();});
      restore(window.openai?.widgetState);
      const initialRoute = location.hash.slice(1);
      if (validRoute(initialRoute)) state.route = initialRoute;
      renderRoute();
    })();
  </script>
</div>

</body>
</html>
